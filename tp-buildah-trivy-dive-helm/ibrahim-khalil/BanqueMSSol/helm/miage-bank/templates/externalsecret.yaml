{{/* ══════════════════════════════════════════════════════════════════
  Vault + External Secrets Operator (approche recommandée)

  Prérequis :
    1. ESO installé : helm install eso external-secrets/external-secrets -n external-secrets
    2. Vault configuré avec le rôle K8s "miage-bank" ayant accès aux paths ci-dessous
    3. Les secrets créés dans Vault :
         vault kv put secret/miage-bank/mysql   username=root password=<pwd>
         vault kv put secret/miage-bank/mongodb username=root password=<pwd>
         vault kv put secret/miage-bank/git     username=<user> password=<token>

  Si Vault n'est pas disponible, désactiver ce fichier via --set vault.enabled=false
  et activer les secrets natifs via --set nativeSecrets.enabled=true
════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.vault.enabled }}
---
# SecretStore — connecteur vers Vault via l'authentification Kubernetes
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.vault.secretStoreName }}
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.address | quote }}
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMountPath | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}

{{- range $secret := .Values.vault.secrets }}
---
# ExternalSecret — synchronise {{ $secret.targetName }} depuis Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.targetName }}
  namespace: {{ include "miage-bank.namespace" $ }}
  labels:
    {{- include "miage-bank.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.vault.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ $secret.targetName }}
    creationPolicy: Owner
  data:
    {{- range $secret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $secret.vaultPath }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════
  Secrets K8s natifs (fallback — activer avec --set nativeSecrets.enabled=true)
  ⚠ Les valeurs sont passées via --set ou un fichier de valeurs chiffré (SOPS)
  Ne jamais committer ce fichier avec des valeurs en clair.
════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.nativeSecrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: banque-mysql-secret
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
  annotations:
    # Ce secret est créé hors chart — non géré par Vault+ESO
    miage-bank/secret-type: "native-fallback"
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.nativeSecrets.mysql.rootPassword | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.nativeSecrets.mysql.rootPassword | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.nativeSecrets.mysql.username | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: banque-mongo-secret
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
  annotations:
    miage-bank/secret-type: "native-fallback"
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.nativeSecrets.mongodb.rootUsername | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.nativeSecrets.mongodb.rootPassword | quote }}
  SPRING_DATA_MONGODB_USERNAME: {{ .Values.nativeSecrets.mongodb.rootUsername | quote }}
  SPRING_DATA_MONGODB_PASSWORD: {{ .Values.nativeSecrets.mongodb.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: banque-git-secret
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
  annotations:
    miage-bank/secret-type: "native-fallback"
stringData:
  SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: {{ .Values.nativeSecrets.git.username | quote }}
  SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: {{ .Values.nativeSecrets.git.password | quote }}
{{- end }}
