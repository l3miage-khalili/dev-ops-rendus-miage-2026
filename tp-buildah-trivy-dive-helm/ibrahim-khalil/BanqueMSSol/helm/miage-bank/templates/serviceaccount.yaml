apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Role minimaliste : lecture des ConfigMaps et Secrets du namespace (least privilege)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miage-bank-role
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miage-bank-rolebinding
  namespace: {{ include "miage-bank.namespace" . }}
  labels:
    {{- include "miage-bank.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ include "miage-bank.namespace" . }}
roleRef:
  kind: Role
  name: miage-bank-role
  apiGroup: rbac.authorization.k8s.io
